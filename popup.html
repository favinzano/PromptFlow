<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PromptFlow</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="brand-row">
    <div class="logo-lockup" role="img" aria-label="PromptFlow">
      <span class="logo-symbol" aria-hidden="true">
        <!-- Felipe Avinzano — Isotipo "La Incisión" · Negativo (fondo oscuro) — geometría original.
             viewBox recortado al área real de la marca (400→242, centrado en 200,200): la marca
             visible crece ~65% dentro de la caja de 20px, sin alterar geometría/rotación/offset. -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="79 79 242 242">
          <rect x="105" y="120" width="160" height="160" fill="#F4F1EB" stroke="none" transform="rotate(-4, 185, 200)" />
          <rect x="135" y="120" width="160" height="160" fill="none" stroke="#F4F1EB" stroke-width="18" transform="rotate(4, 215, 200)" />
        </svg>
      </span>
      <span class="logo-wordmark" aria-hidden="true"><span class="wm-prompt">Prompt</span><span class="wm-flow">Flow</span></span>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="library" role="tab" aria-selected="true">Biblioteca</button>
    <button class="tab" data-tab="enhance" role="tab" aria-selected="false">Mejorar</button>
    <button class="tab" data-tab="settings" role="tab" aria-selected="false">Ajustes</button>
  </nav>

  <main class="content">
    <section id="panel-library" role="tabpanel"></section>
    <section id="panel-enhance" role="tabpanel" hidden></section>
    <section id="panel-settings" role="tabpanel" hidden></section>
  </main>

  <footer class="footer">
    <a href="https://felipeavinzano.com" target="_blank" class="brand-link">felipeavinzano.com</a>
  </footer>

  <script type="module" src="popup/popup.js"></script>
</body>
</html>
